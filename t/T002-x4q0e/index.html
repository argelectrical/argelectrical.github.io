      "No pudimos abrir la ficha.<br>Volvé a escanear el QR que está en la tapa del tablero.";
  }
  try {
    var k = location.hash.slice(1);
    if (!k || !window.crypto || !crypto.subtle) return error();
    var d = bytes(D);
    crypto.subtle.importKey("raw", bytes(k), "AES-GCM", false, ["decrypt"])
      .then(function (llave) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: d.slice(0, 12) }, llave, d.slice(12));
      })
      .then(function (txt) {
        var html = new TextDecoder().decode(txt);
        var doc = new DOMParser().parseFromString(html, "text/html");
        document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
        // los <script> insertados así no corren solos: se recrean para que funcionen
        Array.prototype.forEach.call(document.querySelectorAll("script"), function (viejo) {
          var nuevo = document.createElement("script");
          nuevo.textContent = viejo.textContent;
          viejo.parentNode.replaceChild(nuevo, viejo);
        });
      })
      .catch(error);
  } catch (e) { error(); }
})();
</script>
